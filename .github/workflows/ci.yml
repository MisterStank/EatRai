name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" button in the Actions tab: run CI on any branch before
  # opening a PR.
  workflow_dispatch:

# One run per branch/PR at a time: a newer push cancels the older run instead
# of both using minutes. Never cancel on main, so every merge gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v

  frontend:
    name: Frontend (Expo / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Not yet blocking: the existing codebase has lint errors to work through.
      # Track progress and flip `continue-on-error` to false once clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            e2e/package-lock.json
      # The API tests start the real Go proxy (mock mode, no Google key).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Install app dependencies
        run: npm ci
        working-directory: mobile
      - name: Install e2e dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # webServer in playwright.config.ts builds the Expo web export and starts
      # the Go server itself.
      - name: Run Playwright
        run: npx playwright test
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 14
